<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Prime Video</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
    <nav>
        <div class="nav-bar">
            <div class="left-nav">
                <img src="https://m.media-amazon.com/images/G/01/digital/video/web/logo-min-remaster.png" alt="">
                <a href="">Home</a>
                <a href="">Movies</a>
                <a href="">TV Shows</a>
                <a href="">Live TV</a>
                <span></span>
                <a href=""><i class="ri-function-add-fill"></i>Subscriptions</a>
            </div>
            <div class="right-nav">
                <a class="rounted-100" href=""><i class="ri-search-line"></i></a>
                <a href="">EN <i class="ri-arrow-drop-down-line"></i></a>
                <a class="rounted-100" href=""><i class="ri-grid-fill"></i></a>
                <a class="rounted-100" href=""><i class="ri-account-circle-fill"></i></a>
                <button>Join Prime</button>
            </div>
        </div>
    </nav>
    <section class="hero">
        <div class="hero-box">
            <div class="hero-detail">
                <img src="https://m.media-amazon.com/images/G/01/digital/video/merch/subs/benefit-id/m-r/Prime/logos/channels-logo-color._CB554929912_BR-6_AC_SX750_FMwebp_.png"
                    alt="" class="hero-prime-logo">
                <img src="https://m.media-amazon.com/images/S/sonata-images-prod/PV_IN_TomClancysJackRyanGhostWar_Solo/c9cd2fcb-a766-43c6-b532-cf6da8df220d._BR-6_AC_SX1500_FMwebp_.png"
                    alt="" class="hero-movie-name">
                <p class="hero-rank"><i class="ri-funds-box-line"></i> #4 in India</p>
                <p>In this film, Jack Ryan is pulled back into espionage when a mission reveals a deadly conspiracy. He
                    teams with CIA and MI6 agent Emma Marlowe.</p>
                <div class="hero-button-group">
                    <button class="hero-join-prime-button">Join Prime Watch Now</button>
                    <button class="hero-add-button"><i class="ri-add-large-line"></i></button>
                    <button class="hero-detail-button"><i class="ri-error-warning-line"></i></button>
                </div>
                <p class="hero-watch"><i class="ri-shopping-bag-fill"></i>Watch with a Prime membership</p>
            </div>
        </div>
    </section>
    <section class="top-movies">
        <div class="top-movies-box">
            <h2>Top 10 TV shows in India <i class="ri-funds-box-line"></i></h2>
        <div class="movies-manu">
            <img class="front" src="https://i.pinimg.com/736x/6a/ce/f0/6acef011a19e0173552840f27ad02f94.jpg" alt="">
            <img class="back" src="https://m.media-amazon.com/images/S/pv-target-images/8027fe1fcc5cba00727b0332335ffa165a7b87b4979dbd72e07009300217a69c._UR1920,1080_CLs%7C1920,1080%7C/G/bundle/BottomRightCardGradient16x9.png,/G/01/digital/video/merch/subs/benefit-id/m-r/Prime/logos/channels-logo-white.png%7C0,0,1920,1080+0,0,1920,1080+1578,847,263,156_kvf21cb47db8d34aa971cd86f57a65cf8d_SX899_FMwebp_.jpg" alt="">
        </div>
        </div>
    </section>
</body>

</html>
