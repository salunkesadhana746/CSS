<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insta style</title>

    <style>
        body {
            margin: 0;
            background: #111;
            font-family: sans-serif;
        }

        .style {
            column-count: 6;
            column-gap: 10px;
            padding: 10px;
        }

        .post {
            margin-bottom: 10px;
            border-radius: 8px;
            overflow: hidden;
        }

        .post img {
            width: 100%;
            height: auto;
            display: block;
        }

        .post img :hover {
            transform: scale(1.03);

        }
    </style>

</head>

<body>
    <div class="style">
        <div class="post">
            <img src="https://picsum.photos/300/300?random=1" alt="">
        </div>
        <div class="post">
            <img src="https://picsum.photos/300/600?random=2" alt="">
        </div>
        <div class="post">
            <img src="https://picsum.photos/300/500?random=3" alt="">
        </div>
        <div class="post">
            <img src="https://picsum.photos/300/400?random=4" alt="">
        </div>
        <div class="post">
            <img src="https://picsum.photos/300/600?random=5" alt="">
        </div>
        <div class="post">
            <img src="https://picsum.photos/300/500?random=6" alt="">
        </div>
        <div class="post">
            <img src="https://picsum.photos/300/300?random=7" alt="">
        </div>
        <div class="post">
            <img src="https://picsum.photos/300/600?random=8" alt="">
        </div>
        <div class="post">
            <img src="https://picsum.photos/300/400?random=9" alt="">
        </div>
        <div class="post">
            <img src="https://picsum.photos/300/600?random=10" alt="">
        </div>
        <div class="post">
            <img src="https://picsum.photos/300/500?random=11" alt="">
        </div>
        <div class="post">
            <img src="https://picsum.photos/300/400?random=12" alt="">
        </div>
    </div>
</body>

</html>
